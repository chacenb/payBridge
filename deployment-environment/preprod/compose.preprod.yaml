services:
  paybridge:
    image: ${PAYBRIDGE_IMAGE:?required variable PAYBRIDGE_IMAGE is missing a value}:${PAYBRIDGE_VERSION:?required variable PAYBRIDGE_VERSION is read from the VERSION file by deploy.sh/logs.sh}
    container_name: paybridge-standalone-back
    ports:
      - "${PAYBRIDGE_PORT:-9000}:${SERVER_PORT:-9000}"
    environment:
      SERVER_PORT: ${SERVER_PORT:-9000}
      PAYBRIDGE_CALLBACK_PATH: ${PAYBRIDGE_CALLBACK_PATH:-/sahelyspay/payment/callback}
      PAYBRIDGE_CALLBACK_AIRTEL_PATH: ${PAYBRIDGE_CALLBACK_AIRTEL_PATH:-/sahelyspay/payment/callback/airtel}
      PAYBRIDGE_PUBLIC_BASE_URL: ${PAYBRIDGE_PUBLIC_BASE_URL:?required - the front public URL with its context, like https://host/paybridge}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-paybridge}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-paybridge}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MOMO_THIRD_PARTY_ID: ${MOMO_THIRD_PARTY_ID:-}
      MOMO_PASSWORD: ${MOMO_PASSWORD:-}
      MOMO_RESULT_BASE_URL: ${MOMO_RESULT_BASE_URL:-}
      MOMO_KEY_OWNER: ${MOMO_KEY_OWNER:-1}
      MOMO_CHANNEL_CODE: ${MOMO_CHANNEL_CODE:-1010}
      MOMO_BASE_URL: ${MOMO_BASE_URL:-}
      MOMO_PAYMENT_ENDPOINT: ${MOMO_PAYMENT_ENDPOINT:-/APIRequestMgrService}
      MOMO_SYNC_ENDPOINT: ${MOMO_SYNC_ENDPOINT:-/SYNCAPIRequestMgrService}
      MOOV_TLS_VERIFY: ${MOOV_TLS_VERIFY:-false}
      # Logging (read by log4j2.xml). LOGS_BASE_PATH is the path INSIDE the container.
      # Must match the bind mount target volume below 'PAYBRIDGE_LOGS_DIR'.
      LOGS_BASE_PATH: /app/logs
      LOGFILE_NAME: ${LOGFILE_NAME:-paybridge.log}
      DELETE_LOGS_OLDER_THAN_X_DAYS: ${DELETE_LOGS_OLDER_THAN_X_DAYS:-10}
      LOG_FILE_SIZE: ${LOG_FILE_SIZE:-100 MB}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
    volumes:
      # Logs persist on the host and survive every `compose down` of a release.
      - ${PAYBRIDGE_LOGS_DIR:-/mnt/PAYBRIDGELUN/LOGS}:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: ${CONTAINER_MEMORY_LIMIT:-512m}
    restart: unless-stopped

  paybridge-front:
    image: ${PAYBRIDGE_FRONT_IMAGE:?required variable PAYBRIDGE_FRONT_IMAGE is missing a value}:${PAYBRIDGE_VERSION:?required variable PAYBRIDGE_VERSION is read from the VERSION file by deploy.sh/logs.sh}
    container_name: paybridge-standalone-front
    ports:
      - "${PAYBRIDGE_FRONT_PORT:-9001}:80"
    depends_on:
      - paybridge

  postgres:
    image: postgres:17-alpine
    container_name: paybridge-standalone-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paybridge}
      POSTGRES_USER: ${POSTGRES_USER:-paybridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.preprod}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
