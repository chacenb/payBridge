spring.application.name=payBridge
server.port=${SERVER_PORT:9000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

paybridge.callback.path=${PAYBRIDGE_CALLBACK_PATH:/sahelyspay/payment/callback}
# Additive: Airtel gets its own registered ResultURL, separate from Moov's above (which is
# left unchanged in case it's already registered with Moov in a real environment).
paybridge.callback.airtel.path=${PAYBRIDGE_CALLBACK_AIRTEL_PATH:/sahelyspay/payment/callback/airtel}

# Public base URL this instance is reachable at, used to build the paymentUrl returned to
# clients (PM-03). The /pay/{id} path itself is served by the Payment UI (PM-04, not yet
# implemented) -- this is only the contract's URL shape.
paybridge.public-base-url=${PAYBRIDGE_PUBLIC_BASE_URL:http://localhost:9000}

# PostgreSQL is supplied by Docker Compose in the default runtime. These values
# can be overridden with standard Spring datasource environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/paybridge}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:paybridge}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Moov Money configuration. Supply values through environment variables or an
# untracked local .env file; do not add credentials to this repository.
momo.third-party-id=${MOMO_THIRD_PARTY_ID:}
momo.password=${MOMO_PASSWORD:}
momo.result-url=${MOMO_RESULT_URL:}
momo.key-owner=${MOMO_KEY_OWNER:1}
momo.channel-code=${MOMO_CHANNEL_CODE:1010}

momo.base-url=${MOMO_BASE_URL:}
momo.payment-endpoint=${MOMO_PAYMENT_ENDPOINT:/APIRequestMgrService}
momo.sync-endpoint=${MOMO_SYNC_ENDPOINT:/SYNCAPIRequestMgrService}

# Temporary integration setting matching the real curl -k scripts -- see
# MoovMoneyWebClient's own javadoc for why.
momo.tls-verify=${MOOV_TLS_VERIFY:false}

# Flyway configuration.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
